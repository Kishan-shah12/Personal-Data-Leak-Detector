<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sentinelShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>
    <linearGradient id="sentinelBgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="sentinelCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep stealth backdrop -->
  <rect width="64" height="64" rx="14" fill="#030712" />

  <!-- Outer Cyber Shield Perimeter -->
  <path d="M32 6 L54 15 V31 C54 44.8 44.5 54.5 32 58 C19.5 54.5 10 44.8 10 31 V15 Z" 
        fill="url(#sentinelBgGrad)" 
        stroke="url(#sentinelShieldGrad)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Holographic Reticle Grid Lines -->
  <path d="M32 12 V52 M17 25 H47 M21 38 H43" 
        stroke="#00f0ff" 
        stroke-opacity="0.22" 
        stroke-width="1.2" 
        stroke-linecap="round" />

  <!-- Inner Diamond Quantum Node -->
  <path d="M32 20 L42 30 L32 40 L22 30 Z" 
        fill="#070d1d" 
        stroke="#00f0ff" 
        stroke-width="2" 
        stroke-linejoin="round" 
        filter="url(#sentinelCyanGlow)" />

  <!-- Pulsing Sentinel Iris Core -->
  <circle cx="32" cy="30" r="4.5" fill="#00f0ff" />
  <circle cx="32" cy="30" r="1.8" fill="#ffffff" />

  <!-- Threat Radar Arc Accent (Electric Crimson) -->
  <path d="M25 23 A10 10 0 0 1 39 23" 
        stroke="#ff0055" 
        stroke-width="2.2" 
        stroke-linecap="round" />

  <!-- Quantum Data Lock Lower Nodes -->
  <circle cx="28" cy="46" r="1.2" fill="#00f0ff" opacity="0.8" />
  <circle cx="32" cy="48" r="1.5" fill="#00f0ff" />
  <circle cx="36" cy="46" r="1.2" fill="#00f0ff" opacity="0.8" />
</svg>

