services:
  - type: web
    name: sentinel-core
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: MONGO_URI
        fromDatabase:
          name: sentinel-db
          property: connectionString

databases:
  - name: sentinel-db
    databaseName: sentinel_matrix
    user: sentinel

